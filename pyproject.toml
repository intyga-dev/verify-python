[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sakra-verify"
version = "0.1.0"
description = "Zero-config offline verifier for SÄKRA approval receipts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["cryptography>=40.0.0"]

[tool.setuptools]
packages = ["sakra_verify"]
