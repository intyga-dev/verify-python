[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intyga-verify"
version = "0.1.0"
description = "Zero-config offline verifier for Intyga approval receipts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["cryptography>=40.0.0"]

[tool.setuptools]
packages = ["intyga_verify"]
