[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intyga-verify"
version = "1.2.0"
description = "Offline verifier for INTYGA approval receipts — no INTYGA secret, no network"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "INTYGA" }]
keywords = ["verification", "receipts", "webauthn", "es256", "audit", "offline"]
requires-python = ">=3.10"
dependencies = ["cryptography>=40.0.0"]

[project.urls]
Homepage = "https://www.intyga.com"
Repository = "https://github.com/intyga-dev/verify-python"
Issues = "https://github.com/intyga-dev/verify-python/issues"

[tool.setuptools]
packages = ["intyga_verify"]
